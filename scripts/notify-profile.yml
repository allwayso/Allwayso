name: Notify Profile

on:
  push:
    paths:
      - "**.md"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger profile README update
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/allwayso/Allwayso/dispatches \
            -d '{"event_type": "til-updated"}'
